<!doctype html>
<!-- Social card source. Served by the dev server, not part of the build.
     Regenerate: chrome-headless-shell --headless --window-size=1200,630 \
       --screenshot=og.png http://localhost:5199/og.html  →  public/images/og.jpg -->
<html lang="en"><head><meta charset="utf-8">
<style>
  @font-face { font-family:'Archivo'; font-weight:200 600; font-stretch:75% 125%;
    src:url(/fonts/archivo-latin.woff2) format('woff2'); }
  * { margin:0; box-sizing:border-box; }
  body { width:1200px; height:630px; overflow:hidden; background:#0a0a0b;
         font-family:'Archivo',sans-serif; color:#eeece8; position:relative; }
  img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
        object-position:58% 30%; filter:grayscale(50%) brightness(0.74) contrast(0.92); }
  .scrim { position:absolute; inset:0; background:
      linear-gradient(102deg, rgba(10,10,11,0.52) 0%, rgba(10,10,11,0.18) 45%, rgba(10,10,11,0.28) 100%),
      linear-gradient(to bottom, rgba(10,10,11,0.52) 0%, rgba(10,10,11,0.06) 22%,
        rgba(10,10,11,0.32) 44%, rgba(10,10,11,0.80) 74%, rgba(10,10,11,0.94) 100%); }
  .pad { position:absolute; inset:0; padding:56px 64px; display:flex;
         flex-direction:column; justify-content:flex-end; }
  h1 { font-size:104px; font-weight:200; font-stretch:118%; letter-spacing:0.02em;
       line-height:0.98; text-transform:uppercase; }
  .rule { height:1px; background:rgba(238,236,232,0.14); margin:26px 0 18px; }
  p { font-size:21px; font-weight:300; color:rgba(238,236,232,0.62); }
  .k { font-size:13px; font-weight:500; letter-spacing:0.2em; text-transform:uppercase;
       color:#7f9dff; margin-bottom:18px; }
</style></head>
<body>
  <img src="/images/hero-1200.webp" alt="">
  <div class="scrim"></div>
  <div class="pad">
    <div class="k">Linköping · Stockholm</div>
    <h1>Axel<br>Sundqvist</h1>
    <div class="rule"></div>
    <p>Radio hardware drivers at Ericsson · infrasound grain drying · embedded systems</p>
  </div>
</body></html>
