name: checks

on:
  push:
    branches: [main]
  pull_request:
  # Link rot does not wait for a commit, and a dated reference that links to a
  # moved page is worse than one that links nowhere. The monthly run is what
  # the quarterly review reads.
  schedule:
    - cron: '0 6 1 * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs rather than tags, which are mutable.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      # No dependencies, so no install step.
      - run: npm run check:links
