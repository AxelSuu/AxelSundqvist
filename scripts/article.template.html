    <!-- Same files the film loads, so a reader arriving here first warms the
         cache for the site rather than fetching a second typeface. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/archivo-latin.woff2">
    <style>
      @font-face {
        font-family: 'Archivo';
        font-style: normal;
        font-weight: 200 600;
        font-stretch: 75% 125%;
        font-display: swap;
        src: url(/fonts/archivo-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Archivo';
        font-style: normal;
        font-weight: 200 600;
        font-stretch: 75% 125%;
        font-display: swap;
        src: url(/fonts/archivo-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }

      /* ======================================================================
         The film is dark, full-bleed and image-led. A 7,000-word reference is
         the opposite problem, so this page shares its typeface and nothing
         else: light ground, one measure, and tables that hold still.
         ====================================================================== */
      :root {
        --paper:  #f7f6f3;
        --ink:    #16161a;
        --ink-64: rgba(22, 22, 26, 0.64);
        --ink-40: rgba(22, 22, 26, 0.40);
        --ink-12: rgba(22, 22, 26, 0.12);
        --ink-06: rgba(22, 22, 26, 0.055);
        --accent: #2b3ea8;
        --sans: 'Archivo', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
        --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        color-scheme: light;
      }

      * { box-sizing: border-box; }
      html { background: var(--paper); scroll-behavior: smooth; }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 17px;
        line-height: 1.62;
        font-weight: 350;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

      a { color: var(--accent); text-decoration: none; }
      .prose a { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
      a:hover { opacity: 0.68; }

      .skip {
        position: absolute; left: -9999px;
        background: var(--ink); color: var(--paper); padding: 12px 18px; z-index: 10;
      }
      .skip:focus { left: 16px; top: 16px; }

      /* ── Masthead ────────────────────────────────────────────────────── */
      .masthead {
        border-bottom: 1px solid var(--ink-12);
        padding: 26px clamp(20px, 5vw, 56px);
        display: flex; justify-content: space-between; align-items: baseline;
        gap: 24px; flex-wrap: wrap;
      }
      .back {
        font-size: 13px; letter-spacing: 0.09em; text-transform: uppercase;
        font-weight: 500; color: var(--ink-64);
      }
      .back:hover { color: var(--accent); opacity: 1; }
      .masthead .stamp { font-size: 13px; color: var(--ink-40); letter-spacing: 0.04em; }

      header.title {
        padding: clamp(56px, 11vh, 128px) clamp(20px, 5vw, 56px) 0;
        max-width: 1180px; margin: 0 auto;
      }
      h1 {
        margin: 0;
        font-size: clamp(38px, 6.2vw, 76px);
        line-height: 1.02;
        font-weight: 300;
        letter-spacing: -0.022em;
        max-width: 15ch;
      }

      /* ── Two columns: sticky contents, then the measure ──────────────── */
      .wrap {
        max-width: 1180px; margin: 0 auto;
        padding: clamp(38px, 6vh, 68px) clamp(20px, 5vw, 56px) 0;
        display: grid; gap: clamp(32px, 5vw, 72px);
        grid-template-columns: minmax(0, 1fr);
      }
      @media (min-width: 1000px) {
        .wrap { grid-template-columns: 208px minmax(0, 68ch); }
        .toc { position: sticky; top: 40px; align-self: start; max-height: calc(100vh - 80px); overflow-y: auto; }
      }

      .toc { font-size: 13.5px; line-height: 1.5; }
      .toc-head {
        margin: 0 0 14px; font-size: 11px; letter-spacing: 0.13em;
        text-transform: uppercase; color: var(--ink-40); font-weight: 500;
      }
      .toc ul { list-style: none; margin: 0 0 20px; padding: 0; }
      .toc li { margin-bottom: 7px; }
      .toc a { color: var(--ink-64); }
      .toc a:hover { color: var(--accent); opacity: 1; }
      .toc-part { margin: 0 0 9px; font-weight: 500; }
      .toc-part a { color: var(--ink); }
      /* On a phone the full contents list is longer than the first section, so
         only the three part links survive. */
      @media (max-width: 999px) {
        .toc { border-bottom: 1px solid var(--ink-12); padding-bottom: 22px; }
        .toc ul { display: none; }
        .toc-part { display: inline-block; margin-right: 20px; }
      }

      /* ── Prose ───────────────────────────────────────────────────────── */
      .prose { max-width: 68ch; padding-bottom: 8vh; }
      .prose > p { margin: 0 0 22px; }
      .prose > p:first-child {
        font-size: 19px; color: var(--ink-64); margin-bottom: 34px;
      }
      .prose > p:first-child em { font-style: normal; }

      h2.part {
        margin: clamp(64px, 9vh, 104px) 0 8px;
        font-size: clamp(26px, 3.4vw, 34px);
        font-weight: 300; letter-spacing: -0.015em; line-height: 1.14;
        padding-top: 26px; border-top: 2px solid var(--ink);
      }
      h3 {
        margin: 52px 0 14px;
        font-size: 21px; font-weight: 500; letter-spacing: -0.008em; line-height: 1.25;
        scroll-margin-top: 24px;
      }
      h2.part { scroll-margin-top: 24px; }

      .prose ul { margin: 0 0 22px; padding-left: 22px; }
      .prose li { margin-bottom: 8px; }

      strong { font-weight: 600; }
      /* Bold-led paragraphs label each system design; give them a little air. */
      .prose > p > strong:first-child { display: inline-block; margin-top: 6px; }

      hr { border: 0; border-top: 1px solid var(--ink-12); margin: 46px 0; }

      code {
        font-family: var(--mono); font-size: 0.855em;
        background: var(--ink-06); padding: 0.12em 0.36em; border-radius: 3px;
        overflow-wrap: break-word;
      }

      /* Anything that cannot reflow scrolls inside its own box; the page body
         never scrolls sideways. */
      .scroll { overflow-x: auto; margin: 0 0 26px; -webkit-overflow-scrolling: touch; }
      .scroll pre {
        margin: 0; padding: 18px 20px;
        background: var(--ink-06); border-radius: 4px;
        font-size: 13.5px; line-height: 1.55;
      }
      .scroll pre code { background: none; padding: 0; font-size: inherit; }

      table { border-collapse: collapse; width: 100%; font-size: 14.5px; line-height: 1.5; }
      th, td { text-align: left; padding: 9px 16px 9px 0; vertical-align: top; border-bottom: 1px solid var(--ink-12); }
      th {
        font-size: 11px; letter-spacing: 0.11em; text-transform: uppercase;
        font-weight: 500; color: var(--ink-40); border-bottom-color: var(--ink-40);
        white-space: nowrap;
      }
      td:first-child { white-space: nowrap; padding-right: 26px; }
      td code { background: none; padding: 0; }

      footer.end {
        border-top: 1px solid var(--ink-12);
        margin-top: 6vh; padding: 40px clamp(20px, 5vw, 56px) 12vh;
        max-width: 1180px; margin-left: auto; margin-right: auto;
        display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap;
        font-size: 14px; color: var(--ink-64);
      }
    </style>
  </head>

    <div class="masthead">
      <a class="back" href="/">← Axel Sundqvist</a>
      <span class="stamp">Reviewed September 2026</span>
    </div>

    <header class="title">
      <h1>{{TITLE}}</h1>
    </header>

    <div class="wrap">
      {{TOC}}
      <article class="prose" id="content">
{{CONTENT}}
      </article>
    </div>

    <footer class="end">
      <span>Axel Sundqvist</span>

    </footer>
  </body>
</html>
